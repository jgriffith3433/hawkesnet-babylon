<title>Hawkes Net + Babylon.js</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; color: #e8eaed; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 12px; top: 12px; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px; line-height: 1.5; }
  #hud a { color: #9fe870; }
  #hud .short, #hud .chev { display: none; }
  #hud .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud b { color: #9fe870; }
  #mute { position: fixed; left: 12px; bottom: 12px; z-index: 5; font: inherit; color: #e8eaed; background: rgba(0,0,0,.55); border: 1px solid rgba(159,232,112,.55); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  #mute[aria-pressed="true"] { color: #9aa1ad; border-color: #55606e; }
  #mute:focus-visible { outline: 2px solid #9fe870; outline-offset: 2px; }
  /* Orb scoreboard: top-right, separate from the one-line info panel (left). */
  #scores { position: fixed; right: 12px; top: 12px; z-index: 5; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px; line-height: 1.45; text-align: right; min-width: 6.5rem; pointer-events: none; }
  #scores b { color: #7fe8ff; }
  /* Touch joystick: shown on touch devices only (or with ?touch=1). */
  #stick { position: fixed; left: 28px; bottom: 28px; width: 140px; height: 140px; border-radius: 50%; display: none; touch-action: none; user-select: none; -webkit-user-select: none;
    background: rgba(14,17,22,.45); border: 2px solid rgba(159,232,112,.55); box-shadow: 0 0 18px rgba(159,232,112,.18); }
  #stick i { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: rgba(159,232,112,.7); border: 2px solid #9fe870; pointer-events: none; }
  /* Touch or narrow screens (body.compact, set by the page): the Sound button moves to the bottom-right, away from the joystick;
     the info panel is one line (title short, status) that a tap opens; everything stays inside the safe area. Desktop is unchanged. */
  body.compact #hud { left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); max-width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)); box-sizing: border-box; cursor: pointer; padding: 6px 10px; line-height: 1.4; }
  body.compact #hud .long { display: none; }
  body.compact #hud .short, body.compact #hud .chev { display: inline; }
  body.compact #hud .chev { color: #9fe870; margin-left: 6px; }
  body.compact #hud .more { display: none; margin-top: 4px; }
  body.compact #hud.open .more { display: block; }
  body.compact #hud.open .chev { display: none; }
  body.compact #mute { left: auto; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); }
  body.compact #stick { left: max(28px, env(safe-area-inset-left)); bottom: max(28px, env(safe-area-inset-bottom)); }
  body.compact #scores { right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); font-size: 13px; }
</style>
<script>
  // Playtest stub at once (Studio sees it before Babylon or any module loads), then recover if importing
  // hawkes-net-babylon.mjs fails because the page was opened deeper than the site root: probe ./, ../ and
  // ../../demo-root.json once each (no repeats) and location.replace() to the first that answers, keeping the query
  // string; otherwise show a plain error card over the canvas ('The demo could not load: <reason>').
  (function () {
    var hookAt = performance.now(), err = null, started = '', gone = false, busy = false, tried = Object.create(null);
    var stubScenarios = [
      { id: 'smoke', title: 'Two players in one page meet in a room, move, message and leave', seconds: 45, tags: ['smoke'] },
      { id: 'two-players', title: 'Real browsers on one ?room= find each other, move and message', seconds: 75, tags: ['full', 'multiplayer'] },
      { id: 'phone', title: 'Phone at 390x844: joystick moves you, no overlap, one-line panel', seconds: 50, tags: ['full', 'phone'] },
      { id: 'feel', title: 'Camera and controls feel: eased movement, eased camera, touch joystick', seconds: 40, tags: ['full'] },
      { id: 'quickstart', title: 'The README quickstart page (quickstart.html) loads a scene and a second player joins', seconds: 60, tags: ['full'] },
      { id: 'demo-boot', title: 'Playtest hook within 1 s, deep-path recovery, and module load error card', seconds: 35, tags: ['smoke', 'full'] }
    ];
    window.hawkesPlaytest = {
      __stub: true, version: 1, product: 'hawkes-net-babylon',
      scenarios: function () { return stubScenarios.slice(); },
      start: function (id) { started = String(id || ''); },
      stop: function () {},
      state: function () { return { ready: false, status: err ? 'error' : 'loading', note: err || 'loading' }; },
      report: function () {
        return err ? {
          scenario: started, outcome: 'error', seconds: Math.round((performance.now() - hookAt) / 100) / 10,
          metrics: { hookMs: Math.round(hookAt) },
          events: [{ t: Math.round((performance.now() - hookAt) / 100) / 10, type: 'error', detail: err }],
          problems: [{ severity: 'bug', message: err }], log: ['FAIL ' + err]
        } : null;
      }
    };
    function showCard(reason) {
      err = String(reason || 'module failed to load');
      function paint() {
        var existing = document.getElementById('hawkes-demo-error');
        if (existing) { existing.firstChild.textContent = 'The demo could not load: ' + err; return; }
        var el = document.createElement('div');
        el.id = 'hawkes-demo-error'; el.setAttribute('role', 'alert');
        el.style.cssText = 'position:fixed;inset:0;z-index:99990;display:flex;align-items:center;justify-content:center;background:rgba(14,17,22,.92);color:#e8eaed;font:15px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box';
        var card = document.createElement('div');
        card.style.cssText = 'max-width:30rem;padding:18px 20px;border-radius:10px;background:#151a22;border:1px solid rgba(255,123,114,.55);box-shadow:0 8px 28px rgba(0,0,0,.45);overflow-wrap:anywhere';
        card.textContent = 'The demo could not load: ' + err;
        el.appendChild(card);
        (document.body || document.documentElement).appendChild(el);
      }
      if (document.body) paint(); else document.addEventListener('DOMContentLoaded', paint);
    }
    window.__hawkesDemoBoot = {
      hookAt: hookAt, tried: tried,
      fail: async function (e) {
        if (gone || busy || err) return;
        busy = true;
        var reason = (e && (e.message || String(e))) || 'module failed to load';
        var here = new URL('.', location.href).href;
        var bases = ['./', '../', '../../'];
        for (var i = 0; i < bases.length; i++) {
          var u = new URL(bases[i] + 'demo-root.json', location.href);
          if (tried[u.href]) continue;
          tried[u.href] = 1;
          try {
            var r = await fetch(u.href, { headers: { Accept: 'application/json' } });
            if (!r.ok) continue;
            var j = await r.json().catch(function () { return null; });
            if (!j || j.demo !== true) continue;
            var dest = new URL('.', u);
            if (dest.href === here) break;
            var go = new URL('./', dest);
            go.search = location.search; go.hash = location.hash;
            gone = true; location.replace(go.href); return;
          } catch (x) { /* try the next */ }
        }
        showCard(reason);
      }
    };
    addEventListener('error', function (e) {
      if (!window.hawkesPlaytest || !window.hawkesPlaytest.__stub) return;
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') window.__hawkesDemoBoot.fail(new Error('Failed to load ' + (t.src || './hawkes-net-babylon.mjs')));
      else if ((!t || t === window) && e && (e.error || e.message)) window.__hawkesDemoBoot.fail(e.error || e.message);
    }, true);
    addEventListener('unhandledrejection', function (e) {
      if (window.hawkesPlaytest && window.hawkesPlaytest.__stub) window.__hawkesDemoBoot.fail(e && e.reason);
    });
  })();
</script>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script type="importmap">
{ "imports": { "@hawkesgen/net": "https://net.hawkesgen.ai/sdk/hawkes-net@1.mjs" } }

</head>
<body>
<canvas id="c"></canvas>
<button id="mute" type="button" aria-pressed="false" title="Mute or unmute all sound (M)">🔊 Sound on</button>
<div id="stick" aria-label="Move joystick"><i></i></div>
<div id="scores" aria-live="polite">Orbs…</div>
<div id="hud"><div class="line"><b class="long">Hawkes Net + Babylon.js</b><b class="short">Hawkes Net</b> · <span id="status">connecting…</span><span class="chev" aria-hidden="true">▾</span></div><div class="more"><span id="how">WASD to move · walk into a glowing orb</span> · open this page twice<br><small id="net"></small> · <small id="ver"></small><br><a id="readme" href="https://github.com/jgriffith3433/hawkesnet-babylon#readme" target="_blank" rel="noopener">README: quickstart and API notes</a></div></div>
<script type="module">
(async () => {
  // ?net=http://127.0.0.1:8786 tries a Hawkes Net on this machine (hawkesnet: npm run dev); ?project= your project.
  const q = new URLSearchParams(location.search);
  const endpoint = q.get('net') || undefined;
  // On a Studio beta site the page names beta Hawkes Net (window.HAWKES_NET_ENDPOINT); anywhere else the live one.
  document.getElementById('net').textContent = 'on ' + (endpoint || globalThis.HAWKES_NET_ENDPOINT || 'https://net.hawkesgen.ai').replace(/^https?:\/\//, '');
  const { multiplayer, VERSION } = await import('../hawkes-net-babylon.mjs');
  document.getElementById('ver').textContent = 'v' + VERSION;
  const B = window.BABYLON;
  if (!B) throw new Error('Babylon.js did not load');
  const engine = new B.Engine(document.getElementById('c'), true);
  const scene = new B.Scene(engine);
  scene.clearColor = new B.Color4(0.05, 0.07, 0.12, 1);
  scene.fogMode = B.Scene.FOGMODE_EXP2; scene.fogDensity = 0.012; scene.fogColor = new B.Color3(0.55, 0.68, 0.85);
  const cam = new B.ArcRotateCamera('cam', -Math.PI / 2, 1.0, 20, new B.Vector3(0, 1, 0), scene);
  cam.lowerRadiusLimit = 8; cam.upperRadiusLimit = 34; cam.upperBetaLimit = 1.45;
  cam.fov = 65 * Math.PI / 180;   // vertical field of view: 65 degrees
  cam.attachControl(true);

  // Procedural textures drawn on canvases: nothing to download, nothing to generate.
  const paint = (label, size, draw) => { const t = new B.DynamicTexture(label, size, scene, true); draw(t.getContext(), size); t.update(); return t; };
  const rnd = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();

  // Sky: a gradient dome with stars toward the top, no lighting on it.
  const skyTex = paint('skyTex', { width: 1024, height: 512 }, (g, { width: w, height: h }) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#0b1633'); gr.addColorStop(0.45, '#2c4f86'); gr.addColorStop(0.8, '#e69a6a'); gr.addColorStop(1, '#f6d6a0');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(255,255,255,${0.3 + rnd() * 0.7})`; const r = rnd() < 0.1 ? 2 : 1; g.fillRect(rnd() * w, rnd() * h * 0.4, r, r); }
  });
  const sky = B.MeshBuilder.CreateSphere('sky', { diameter: 400, segments: 24, sideOrientation: B.Mesh.BACKSIDE }, scene);
  const skyMat = new B.StandardMaterial('skyMat', scene);
  skyMat.disableLighting = true; skyMat.backFaceCulling = false; skyMat.fogEnabled = false;
  skyMat.emissiveTexture = skyTex; skyMat.diffuseColor = B.Color3.Black(); skyMat.specularColor = B.Color3.Black();
  sky.material = skyMat; sky.infiniteDistance = true; sky.isPickable = false;

  // Light: a cool sky fill, a warm low sun that casts shadows, and a glow in the middle of the arena.
  const fill = new B.HemisphericLight('fill', new B.Vector3(0.2, 1, 0.1), scene);
  fill.intensity = 0.55; fill.diffuse = new B.Color3(0.75, 0.85, 1); fill.groundColor = new B.Color3(0.25, 0.22, 0.3);
  const sun = new B.DirectionalLight('sun', new B.Vector3(-0.5, -1, -0.35), scene);
  sun.position = new B.Vector3(20, 30, 14); sun.intensity = 1.1; sun.diffuse = new B.Color3(1, 0.88, 0.7);
  const shadows = new B.ShadowGenerator(1024, sun);
  shadows.useBlurExponentialShadowMap = true; shadows.blurKernel = 16; shadows.darkness = 0.35;

  // Ground: a flagstone arena floor with a ring painted in it.
  const floorTex = paint('floorTex', 1024, (g, S) => {
    const n = 8, c = S / n;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const v = 70 + Math.floor(rnd() * 28);
      g.fillStyle = `rgb(${v},${v + 6},${v + 14})`; g.fillRect(x * c, y * c, c, c);
      g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 4; g.strokeRect(x * c, y * c, c, c);
    }
    for (let i = 0; i < 5000; i++) { const v = rnd() < 0.5 ? 0 : 255; g.fillStyle = `rgba(${v},${v},${v},.05)`; g.fillRect(rnd() * S, rnd() * S, 2, 2); }
  });
  floorTex.uScale = floorTex.vScale = 4;
  const ground = B.MeshBuilder.CreateGround('ground', { width: 36, height: 36 }, scene);
  const gm = new B.StandardMaterial('g', scene);
  gm.diffuseTexture = floorTex; gm.specularColor = new B.Color3(0.12, 0.12, 0.14);
  ground.material = gm; ground.receiveShadows = true;
  const ringTex = paint('ringTex', 512, (g, S) => {
    g.clearRect(0, 0, S, S); g.strokeStyle = 'rgba(159,232,112,.9)'; g.lineWidth = 8;
    g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 12, 0, Math.PI * 2); g.stroke();
    g.lineWidth = 3; g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 40, 0, Math.PI * 2); g.stroke();
  });
  ringTex.hasAlpha = true;
  const ring = B.MeshBuilder.CreateGround('ring', { width: 12, height: 12 }, scene);
  ring.position.y = 0.01;
  const rm = new B.StandardMaterial('ringMat', scene);
  rm.diffuseTexture = ringTex; rm.useAlphaFromDiffuseTexture = true; rm.emissiveColor = new B.Color3(0.35, 0.6, 0.3); rm.disableLighting = true;
  ring.material = rm;

  // Pillars round the edge, each with a torch that really lights the floor.
  const stone = new B.StandardMaterial('stone', scene);
  stone.diffuseTexture = floorTex; stone.diffuseColor = new B.Color3(0.9, 0.9, 1);
  const flame = new B.StandardMaterial('flame', scene);
  flame.emissiveColor = new B.Color3(1, 0.7, 0.3); flame.disableLighting = true;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2, x = Math.cos(a) * 15, z = Math.sin(a) * 15;
    const pil = B.MeshBuilder.CreateCylinder('pillar' + i, { height: 4, diameterTop: 1, diameterBottom: 1.4, tessellation: 12 }, scene);
    pil.position.set(x, 2, z); pil.material = stone; pil.receiveShadows = true; shadows.addShadowCaster(pil);
    const f = B.MeshBuilder.CreateSphere('flame' + i, { diameter: 0.6, segments: 8 }, scene);
    f.position.set(x, 4.5, z); f.material = flame;
    const torch = new B.PointLight('torch' + i, new B.Vector3(x * 0.92, 4.2, z * 0.92), scene);
    torch.diffuse = new B.Color3(1, 0.65, 0.3); torch.intensity = 0.35; torch.range = 14;
  }

  // The player: a node standing on the floor (that is what Hawkes Net sends), a capsule in it, a nameplate over it.
  const me = new B.TransformNode('me', scene);
  const body = B.MeshBuilder.CreateCapsule('me-body', { height: 1.8, radius: 0.35 }, scene);
  body.position.y = 0.9; body.parent = me;
  const mm = new B.StandardMaterial('m', scene); mm.diffuseColor = new B.Color3(1, 0.85, 0.3); body.material = mm;
  shadows.addShadowCaster(body);
  const crate = B.MeshBuilder.CreateBox('crate', { size: 1 }, scene);
  crate.position.set(3, 0.5, 3); shadows.addShadowCaster(crate);
  const cm = new B.StandardMaterial('crateMat', scene); cm.diffuseColor = new B.Color3(0.75, 0.5, 0.25); crate.material = cm;
  // Other players' capsules (made by the module) cast shadows too.
  scene.onNewMeshAddedObservable.add((m) => { if (m.name.startsWith('hn-body-')) shadows.addShadowCaster(m); });

  // A nameplate in the module's own style, for the local player (the module draws everyone else's).
  const plate = (label, parent) => {
    const t = B.MeshBuilder.CreatePlane('me-tag', { width: 1.6, height: 0.4 }, scene);
    t.position.y = 2.2; t.billboardMode = B.Mesh.BILLBOARDMODE_ALL; t.parent = parent; t.isPickable = false;
    const tex = new B.DynamicTexture('me-tagtex', { width: 512, height: 128 }, scene, false);
    tex.hasAlpha = true; tex.drawText(label, null, 90, 'bold 64px sans-serif', '#9fe870', 'transparent', true);
    const tm = new B.StandardMaterial('me-tagmat', scene);
    tm.diffuseTexture = tex; tm.emissiveColor = new B.Color3(1, 1, 1); tm.disableLighting = true; tm.useAlphaFromDiffuseTexture = true; tm.backFaceCulling = false;
    t.material = tm;
  };

  // Sound (audio.mjs): starts at the first click, key or touch, never before; the mute choice is remembered.
  const { createAudio } = await import('./audio.mjs');
  const audio = createAudio();
  const muteBtn = document.getElementById('mute');
  const showMute = (m) => { muteBtn.setAttribute('aria-pressed', String(m)); muteBtn.textContent = m ? '🔇 Sound off' : '🔊 Sound on'; };
  showMute(audio.muted); audio.onMute(showMute);
  muteBtn.addEventListener('click', () => audio.toggle());
  muteBtn.addEventListener('keydown', (e) => e.stopPropagation());   // Space/Enter on the button must not also count as movement
  addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'm' && !e.repeat) audio.toggle(); });

  const name = 'Player ' + Math.floor(Math.random() * 900 + 100);
  plate(name, me);
  const mp = multiplayer(scene, { babylon: B, project: q.get('project') || 'netdemo', endpoint, name, player: me, area: 'babylon-demo' });
  // The host spins the crate; everyone sees it.
  mp.share(crate, 'crate');
  mp.onPresence((e) => { if (e.id === mp.lobby?.id) return; if (e.type === 'spawn') audio.chime(); else if (e.type === 'leave') audio.farewell(); });
  mp.when('status', ({ status }) => { document.getElementById('status').innerHTML = `<b>${status}</b> as ${name}`; });

  // Host-authoritative glowing orbs (sync.state / sync.action): walk into one to score; host awards and respawns.
  const { createOrbs } = await import('./orbs.mjs');
  const scoresEl = document.getElementById('scores');
  const orbs = createOrbs({
    BABYLON: B, scene,
    onCollect: (kind) => { if (kind === 'self') audio.collect(); },
    onHud: (html) => { scoresEl.innerHTML = html; },
  });
  const attachOrbs = () => { if (mp.lobby?.ready || mp.room) orbs.attachMain(mp.lobby); };
  mp.when('joined', () => attachOrbs());
  attachOrbs();
  window.hawkesBabylonOrbs = orbs;

  // ---- Controls: keys and a touch joystick feed one input vector; the player accelerates toward it and eases to a stop.
  const keys = {};
  addEventListener('keydown', (e) => (keys[e.key.toLowerCase()] = true));
  addEventListener('keyup', (e) => (keys[e.key.toLowerCase()] = false));
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  const EDGE = 17.4;   // how far from the centre the player may walk: the floor's edge (18) less the capsule
  const MAX_SPEED = 5, ACCEL = 18, DECEL = 14;   // units/s, units/s²
  const FOLLOW = 4;                              // camera follow rate: higher is tighter
  let pretendTouch = false;                      // set only by the playtest's named setup option {touch:true}
  const touchCapable = () => pretendTouch || q.get('touch') === '1' || (navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
  const layout = () => { document.body.classList.toggle('compact', touchCapable() || matchMedia('(max-width: 640px)').matches); };
  const stick = document.getElementById('stick'), knob = stick.firstElementChild;
  const joy = { x: 0, y: 0, id: null };          // y up is positive
  const joyMove = (e) => {
    const r = stick.getBoundingClientRect(), R = r.width / 2;
    let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
    const len = Math.hypot(dx, dy), lim = R - 10;
    if (len > lim) { dx *= lim / len; dy *= lim / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    // A small dead zone, then full range at the rim.
    const m = Math.min(1, len / lim), k = m < 0.12 ? 0 : (m - 0.12) / 0.88;
    joy.x = len ? (dx / len) * k : 0; joy.y = len ? (-dy / len) * k : 0;
  };
  const joyEnd = (e) => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
  stick.addEventListener('pointerdown', (e) => { if (joy.id !== null) return; joy.id = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch {} joyMove(e); e.preventDefault(); });
  stick.addEventListener('pointermove', (e) => { if (e.pointerId === joy.id) joyMove(e); });
  stick.addEventListener('pointerup', joyEnd); stick.addEventListener('pointercancel', joyEnd);
  const showStick = (on = true) => { stick.style.display = on ? 'block' : 'none'; layout(); };
  showStick(touchCapable());
  const hud = document.getElementById('hud');
  if (touchCapable()) document.getElementById('how').textContent = 'stick to move';
  // Compact layout: touch devices and narrow screens. A tap on the panel opens or closes the full info.
  layout(); addEventListener('resize', layout);
  hud.addEventListener('click', (e) => { if (document.body.classList.contains('compact') && !e.target.closest('a')) { hud.classList.toggle('open'); hud.setAttribute('aria-expanded', hud.classList.contains('open')); } });

  const vel = { x: 0, z: 0 };
  let stride = 0;
  const motion = { speed: 0, camLag: 0, camJump: 0, camInside: false, frames: 0 };   // read by the playtest checks
  let lastCam = null;
  // After every frame: the largest jump the camera made and whether its eye is inside a solid mesh (the floor, a pillar, the crate).
  scene.onAfterRenderObservable.add(() => {
    const p = cam.globalPosition;
    motion.camJump = lastCam ? Math.hypot(p.x - lastCam.x, p.y - lastCam.y, p.z - lastCam.z) : 0;
    lastCam = p.clone(); motion.frames++;
    motion.camInside = p.y < 0.05 || scene.meshes.some((m) => (m.name === 'crate' || m.name.startsWith('pillar')) && m.getBoundingInfo().boundingBox.intersectsPoint(p));
  });
  scene.onBeforeRenderObservable.add(() => {

          if (st.status !== 'won') throw new Error(`quickstart smoke ${st.status}: ${r.problems.map((p) => p.message).join('; ').slice(0, 150)}`);
          return `${r.metrics.checksPassed} checks passed, second player joined in ${r.metrics.secondJoinMs} ms`;
        });
        frame.remove();
      },
    }, {
      id: 'phone', title: 'Phone at 390x844: joystick moves you, no overlap, one-line panel', seconds: 50, tags: ['full', 'phone'],
      description: 'Honest phone playtest: runs on a 390x844 surface with touch pointer events (in-page when the runner is already phone-sized, otherwise a same-origin phone frame). Drags the on-screen joystick and asserts the capsule moves that way; asserts the Sound button does not overlap the stick, the info panel is one line, there is no sideways scroll, and text is at least 12 px. Emits Phone / Phone layout / Phone joystick scenes for screenshots.',
      run: async ({ check, event, scene: setScene, until, wait, metric, progress }) => {
        await until(() => scene.isReady() && me && window.__hawkesDemoProbe?.ready(), 20000, 'the demo to be ready');
        let frame = null, target = window, probe = window.__hawkesDemoProbe;
        try {
          if (!atPhoneSize()) {
            // Desktop runner: a real 390x844 frame at the origin (no CSS scale) so pointer clientX/Y match the frame's stick math.
            // Studio's :phone twin uses the in-page path below; this path keeps phone@desktop honest too.
            frame = document.createElement('iframe');
            frame.title = 'Phone 390x844';
            frame.style.cssText = `position:fixed;left:0;top:0;width:${PHONE_W}px;height:${PHONE_H}px;border:0;background:#0e1116;z-index:80`;
            // No ?playtest= so the frame does not nest another phone run; keep room/project/net from this page.
            const u = new URL(location.href);
            u.searchParams.delete('playtest');
            u.searchParams.set('touch', '1');
            frame.src = u.href;
            document.body.appendChild(frame);
            event('phone-frame', `opened ${PHONE_W}x${PHONE_H} frame at origin`);
            await until(() => {
              try { return frame.contentWindow?.__hawkesDemoProbe?.ready(); } catch { return false; }
            }, 30000, 'the phone frame to load the demo');
            target = frame.contentWindow;
            probe = target.__hawkesDemoProbe;
          } else {
            event('phone-native', `runner viewport is already ${innerWidth}x${innerHeight}`);
          }
          progress(0.15);
          await phoneChecks({
            check, until, wait, event, metric, scene: setScene,
            win: target, doc: target.document, probe,
          });
          progress(1);
        } finally {
          if (frame) frame.remove();
        }
      },
    }, {
      id: 'feel', title: 'Camera and controls feel: eased movement, eased camera, touch joystick', seconds: 40, tags: ['full'],
      description: 'One player alone on the demo: walks by real keys (acceleration, braking), watches the camera ease after it, then with the named setup option touch:true (default here) the page is set up as a touch device, the joystick must appear on screen and is dragged by real pointer events. Options: touch (default true).',
      run: async ({ check, event, until, wait, options, metric }) => {
        await until(() => scene.isReady() && me, 20000, 'the scene to be ready');
        if (options.touch !== false) { pretendTouch = true; showStick(touchCapable()); event('touch-device', 'setup: page set up as a touch device'); }
        await feelChecks({ check, until, wait, event, metric });
      },
    }, {
      id: 'demo-boot', title: 'Playtest hook within 1 s, deep-path recovery, and module load error card', seconds: 35, tags: ['smoke', 'full'],
      description: 'Checks the three boot criteria: (1) opening the site root shows the 3D demo and its playtest hook appears within 1 s; (2) opening a deeper path (./a/b/?playtest=&bootq=..., where /a/b/hawkes-net-babylon.mjs and /a/b/ and /a/ demo-root.json probes intentionally 404 before ../../demo-root.json answers) location.replace()s to the working 3D demo with the same query string; (3) if a module cannot load (./a/b/c/, where ./, ../ and ../../demo-root.json all 404), a plain error card ("The demo could not load: <reason>") explains why over the canvas instead of a blank canvas.',
      run: async ({ check, event, until, wait, metric, progress }) => {
        await check('Opening the site root shows the 3D demo and its playtest hook appears within 1 s', async () => {
          const hookMs = Math.round(window.__hawkesDemoBoot?.hookAt ?? 9999);
          metric('hookMs', hookMs);
          if (!(hookMs < 1000)) throw new Error(`window.hawkesPlaytest appeared at ${hookMs} ms (limit 1000 ms)`);
          await until(() => scene.isReady() && me && (mp.lobby?.ready || mp.lobby?.status === 'online'), 20000, 'the 3D demo scene to be ready and online');
          const c = document.getElementById('c');
          if (!c || c.width < 100 || scene.lights.length < 3 || !ground.material?.diffuseTexture || !sky.material?.emissiveTexture) {
            throw new Error('the 3D demo scene is not fully drawn');
          }
          const from = me.position.clone();
          key('d', true); await wait(700); key('d', false);
          key('w', true); await wait(600); key('w', false);
          await wait(300);
          const moved = Math.hypot(me.position.x - from.x, me.position.z - from.z);
          if (moved < 0.8) throw new Error(`real WASD input moved the player only ${moved.toFixed(2)}`);
          const ids = window.hawkesPlaytest.scenarios().map((s) => s.id).join(', ');
          event('root-demo-ready', `hook at ${hookMs} ms, 3D scene v${VERSION}, moved ${moved.toFixed(1)} u, scenarios: ${ids}`);
          return `hook in ${hookMs} ms (< 1000 ms); 3D demo v${VERSION} rendered and moved ${moved.toFixed(1)} units (${ids})`;
        });
        progress(0.35);
        const makePane = (caption) => {
          const wrap = document.createElement('div');
          wrap.id = 'hawkes-boot-pane';
          wrap.style.cssText = 'position:fixed;left:16px;bottom:16px;width:min(680px,calc(100vw - 32px));height:min(420px,56vh);z-index:60;display:flex;flex-direction:column;border:2px solid #9fe870;border-radius:10px;overflow:hidden;background:#0e1116;box-shadow:0 8px 28px rgba(0,0,0,.6)';
          const bar = document.createElement('div');
          bar.style.cssText = 'padding:6px 10px;background:#151a22;color:#9fe870;font:12px/1.4 ui-monospace,Menlo,monospace;border-bottom:1px solid rgba(159,232,112,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
          bar.textContent = caption;
          const f = document.createElement('iframe');
          f.title = caption;
          f.style.cssText = 'flex:1;width:100%;border:0;background:#0e1116';
          wrap.append(bar, f);
          document.body.appendChild(wrap);
          return { wrap, bar, f };
        };
        await check('Opening a deeper path lands on the working demo with the same query string', async () => {
          const token = 'q' + Date.now().toString(36);
          const deep = new URL('./a/b/index.html', location.href);
          deep.search = `?playtest=&bootq=${token}`;
          const { wrap, bar, f } = makePane(`Deep path test: opening ./a/b/?playtest=&bootq=${token}`);
          f.src = deep.href;
          event('deep-path-open', `${deep.pathname}${deep.search} (expected 404 on /a/b/hawkes-net-babylon.mjs -> probes demo-root.json -> location.replace to root)`);
          try {
            await until(() => {
              try {
                const w = f.contentWindow; if (!w?.location) return false;
                if (/\/a\/b(\/|$)/.test(w.location.pathname)) return false;
                const sq = new URLSearchParams(w.location.search);
                return sq.has('playtest') && sq.get('bootq') === token && w.hawkesPlaytest && !w.hawkesPlaytest.__stub && w.hawkesPlaytest.state().ready;
              } catch { return false; }
            }, 25000, 'the deeper path (/a/b/) to location.replace() to the demo root and load the 3D scene');
            const w = f.contentWindow, d = f.contentDocument;
            const c = d.getElementById('c'), ver = d.getElementById('ver')?.textContent;
            if (!c || c.width < 100 || ver !== 'v' + VERSION) throw new Error(`redirected page missing canvas or version (${ver})`);
            bar.textContent = `Redirected ./a/b/ -> ${w.location.pathname}${w.location.search} (3D demo ${ver} ready)`;
            metric('deepRedirectFound', 1);
            event('deep-path-landed', `${w.location.pathname}${w.location.search} (${ver}, canvas ${c.width}x${c.height})`);
            await wait(2000);
            return `opened ./a/b/?playtest=&bootq=${token} -> landed on ${w.location.pathname}${w.location.search} (${ver}, 3D canvas ${c.width}x${c.height})`;
          } finally { wrap.remove(); }
        });
        progress(0.7);
        await check('If a module cannot load, a plain error card explains why instead of a blank canvas', async () => {
          const broken = new URL('./a/b/c/index.html', location.href);
          const { wrap, bar, f } = makePane('Module load error test: opening ./a/b/c/ (beyond demo-root.json reach)');
          f.src = broken.href;
          event('error-card-open', `${broken.pathname} (expected 404 on module and ./, ../, ../../demo-root.json -> shows plain error card)`);
          try {
            let card = null;
            await until(() => {
              try { card = f.contentDocument?.getElementById('hawkes-demo-error'); return Boolean(card); } catch { return false; }
            }, 15000, 'the plain error card (#hawkes-demo-error) to appear over the canvas');
            const text = card.textContent.trim();
            if (!/^The demo could not load: \S+/.test(text)) throw new Error(`unexpected error card text: "${text.slice(0, 120)}"`);
            const rect = card.getBoundingClientRect();
            if (rect.width < 120 || rect.height < 40) throw new Error(`error card is not visible over the canvas (${Math.round(rect.width)}x${Math.round(rect.height)})`);
            const triedUrls = Object.keys(f.contentWindow?.__hawkesDemoBoot?.tried || {});
            if (triedUrls.length !== 3) throw new Error(`expected 3 distinct demo-root.json probes, got ${triedUrls.length}`);
            const st = f.contentWindow?.hawkesPlaytest?.state();
            if (st?.status !== 'error') throw new Error(`stub state is ${st?.status}, expected error`);
            bar.textContent = `Error card shown over canvas: ${text.slice(0, 72)}`;
            event('error-card-shown', text.slice(0, 180));
            await wait(2500);
            return `${text.slice(0, 140)} (probed 3 paths once each, no repeats)`;
          } finally { wrap.remove(); }
        });
        await wait(500);
        progress(1);
      },
    }],
    product: 'hawkes-net-babylon',
    where: (endpoint || globalThis.HAWKES_NET_ENDPOINT || 'https://net.hawkesgen.ai').replace(/^https?:\/\//, ''),
    main: () => mp.lobby,
    openBot: async () => openPlaytestPeer('Playtest bot', `pt-${Math.random()}`),
    drive: async (step) => { key('d', true); await step(1200); key('d', false); key('w', true); await step(900); key('w', false); await step(100); },
    myPos: () => { const p = me.getAbsolutePosition(); return [p.x, p.y, p.z]; },
    shownPos: (id) => { const n = mp.peers.get(id)?.node; return n ? [n.position.x, n.position.y, n.position.z] : null; },
    botPose: (u) => [-4 + 8 * u, 0, -4],
    tolerance: 0.3,
    // Extends two-players: open a bot as B, steer onto an orb, assert A sees B's score rise within 500 ms.
    afterTwoPlayers: async (c) => {
      let bot = null;
      try {
        bot = await (c.openBot ? c.openBot() : openPlaytestPeer('Orb bot', `orb-${Math.random()}`));
        await c.until(() => bot && (bot.ready || bot.room?.status === 'online') && c.main.peers.has(bot.id), 15000, 'the orb collector bot to join');
        await orbChecks({
          check: c.check, main: c.main, collector: bot, until: c.until, wait: c.wait, metric: c.metric,
          openLate: () => openPlaytestPeer('Late joiner', `late-${Math.random()}`),
          event: c.event || (() => {}), scene: c.scene,
        });
      } finally { try { await bot?.leave(); } catch { /* gone */ } }
    },
    // Criteria checks on the look of the scene, run in the smoke scenario while the second player is in the room.
    extra: async ({ check, main, bot, until, wait, event, options = {}, metric, scene: setScene }) => {
      // Feel: real key and pointer input; the numbers are read from the controls the page really runs.
      // Same named setup as the feel scenario: the page is set up as a touch device, so the stick shows before it is dragged.
      if (options.touch !== false) { pretendTouch = true; showStick(touchCapable()); event?.('touch-device', 'setup: page set up as a touch device'); }
      await feelChecks({ check, until, wait, event: event || (() => {}), metric });
      // Full orb criteria (collect + late join) run on two-players via afterTwoPlayers; smoke only checks they lit.
      await check('Six glowing orbs are on the court', async () => {
        orbs.wire(main);
        const ms = await until(() => orbs.snapshot(main).orbs.length === 6, 10000, 'the host to place six orbs');
        const snap = orbs.snapshot(main);
        for (const g of orbs.groundGaps()) {
          if (g.gap > 0.02 || g.gap < -0.05) throw new Error(`quality.ground-contact: ${g.id} ${(g.gap * 100).toFixed(0)} cm off the ground`);
        }
        metric?.('orbCount', snap.orbs.length);
        metric?.('orbsSyncMs', Math.round(ms));
        event?.('orbs', snap.orbs.map((o) => `${o.id}@${o.x.toFixed(1)},${o.z.toFixed(1)}`).join(' '));
        setScene?.('Orbs');
        return `${snap.orbs.length} orbs after ${Math.round(ms)} ms`;
      });
      await check('The info panel shows the package version', async () => {
        const shown = document.getElementById('ver')?.textContent || '';
        if (shown !== 'v' + VERSION) throw new Error(`panel says "${shown}", package is v${VERSION}`);
        return `info panel shows ${shown}`;
      });
      await check('The scene is lit, with a textured floor and a sky', async () => {
        const lights = scene.lights.length;
        if (lights < 3) throw new Error(`only ${lights} lights`);
        if (!ground.material?.diffuseTexture) throw new Error('the floor has no texture');
        if (!sky.material?.emissiveTexture || !sky.isEnabled()) throw new Error('no sky');
        if (!shadows.getShadowMap()) throw new Error('no shadows');
        return `${lights} lights, floor and sky textured, shadows on`;
      });
      await check('Every avatar shows a nameplate with its name', async () => {
        const mine = me.getChildMeshes().some((m) => m.name === 'me-tag' && m.isEnabled());
        if (!mine) throw new Error("this player's own nameplate is missing");
        await until(() => { const n = mp.peers.get(bot.id)?.node; return n && n.getChildMeshes().some((m) => m.name.startsWith('hn-tag-') && m.isEnabled()); }, 5000, "the second player's nameplate over its avatar");
        return `own and ${bot.name ?? 'the second player'}'s nameplates shown`;
      });
      // Presence: a third player pops in, waves are seen both ways, and the third player fades out when it leaves.
      let guest = null;
      const armOn = (node) => node?.getChildMeshes().some((m) => m.name.startsWith('hn-emote-arm'));
      await check('A joining player plays a spawn effect for the other tab', async () => {
        guest = lobby({ project: q.get('project') || 'netdemo', transport: 'relay', ...(endpoint ? { endpoint } : {}), name: 'Playtest guest', log: false });
        guest.join('babylon-demo');
        await until(() => guest.ready && mp.peers.has(guest.id), 15000, 'the guest to join the room');
        guest.pose([2, 0, -2], 0);
        let sawRing = false;
        await until(() => { sawRing = sawRing || Boolean(scene.getMeshByName('hn-spawn-ring')); return mp.presence.some((e) => e.type === 'spawn' && e.id === guest.id); }, 8000, "a spawn event for the guest's avatar");
        const n = mp.peers.get(guest.id).node;
        const small = n.scaling.x < 1 || n.getChildMeshes()[0].visibility < 1;
        await until(() => { sawRing = sawRing || Boolean(scene.getMeshByName('hn-spawn-ring')); return sawRing; }, 2000, 'the spawn ring on the floor');
        await until(() => n.scaling.x === 1 && n.getChildMeshes()[0].visibility === 1, 4000, 'the pop to settle at full size');
        return `popped in${small ? ' from small and faint' : ''}, with a ring`;
      });
      await check('Pressing E shows a wave on the other tab', async () => {
        let got = 0; const off = bot.on('hn-emote', (d) => { if (d?.e === 'wave') got++; });
        key('e', true); key('e', false);
        await until(() => got > 0, 5000, 'the other player to receive the wave');
        off();
        if (!armOn(me)) throw new Error('no raised arm on this player when pressing E');
        // And theirs shows here.
        bot.send('hn-emote', { e: 'wave' });
        await until(() => mp.presence.some((e) => e.type === 'emote' && e.id === bot.id) && armOn(mp.peers.get(bot.id)?.node), 5000, "a raised arm on the other player's avatar");
        return 'E waves here and there, an arm swings on the avatar';
      });
      // Sound: made with Web Audio after the first gesture; checks read the page's real audio state and click the real button.
      await check('Audio starts only after the first user gesture', async () => {
        const { createAudio } = await import('./audio.mjs');
        const fresh = createAudio({ storageKey: 'hawkes-net-babylon:playtest-fresh' });   // a page that nobody has touched yet
        try {
          if (fresh.unlocked) throw new Error('sound started before any gesture');
          if (fresh.chime() || fresh.stats.droppedBeforeGesture !== 1) throw new Error('a chime played before any gesture');
          dispatchEvent(new KeyboardEvent('keydown', { key: 'x', bubbles: true }));
          if (!fresh.unlocked) throw new Error('the first key press did not start the sound');
        } finally { fresh.close(); try { localStorage.removeItem('hawkes-net-babylon:playtest-fresh'); } catch {} }
        if (audio.stats.contextAt && audio.stats.contextAt < audio.stats.gestureAt) throw new Error('this page made its sound before a gesture');
        return `nothing before a gesture; the first key press starts it (page sound: ${audio.state})`;
      });
      await check('Footsteps sound while walking, none while standing', async () => {
        await until(() => motion.speed < 0.01, 5000, 'the player to stand still');
        const still = audio.stats.steps; await wait(400);
        if (audio.stats.steps !== still) throw new Error('footsteps while standing still');
        const from = me.position.x, dir = from > 0 ? 'a' : 'd';   // walk away from the floor's edge (a wall stops the player, silently)
        key(dir, true);
        await until(() => audio.stats.steps >= still + 2, 4000, 'footsteps while walking');
        key(dir, false);
        await until(() => motion.speed < 0.01, 4000, 'the player to stop');
        return `${audio.stats.steps - still} steps over ${Math.abs(me.position.x - from).toFixed(1)} units`;
      });
      await check('A chime plays when another player joins', async () => {
        const before = audio.stats.chimes;
        const g = lobby({ project: q.get('project') || 'netdemo', transport: 'relay', ...(endpoint ? { endpoint } : {}), name: 'Chime guest', log: false });
        g.join('babylon-demo');
        try {
          // A player appears (and chimes) when their first pose arrives, so the guest has to send one, as a real player does.
          await until(() => g.ready && mp.peers.has(g.id), 15000, 'the guest to join the room');
          g.pose([-2, 0, 2], 0);
          await until(() => audio.stats.chimes > before, 15000, 'a chime for the joining player');
        } finally { await g.leave(); }
        return `chimed as ${g.name ?? 'the guest'} joined (${audio.stats.chimes} so far, sound ${audio.state})`;
      });
      await check('The mute button silences everything and is remembered', async () => {
        const btn = document.getElementById('mute'), was = audio.muted;
        if (was) btn.click();                              // start from sound on
        await wait(100);
        btn.click();                                       // a real click on the button
        if (!audio.muted || btn.getAttribute('aria-pressed') !== 'true') throw new Error('the button did not mute');
        await until(() => audio.level === null || audio.level < 0.01, 2000, 'the master volume to fall to zero');
        const silent = audio.stats.silenced;
        audio.chime(); audio.footstep();
        if (audio.stats.silenced !== silent + 2) throw new Error('a sound played while muted');
        const { createAudio } = await import('./audio.mjs');
        const next = createAudio();                        // what a reload does: read the saved choice
        const remembered = next.muted; next.close();
        if (!remembered) throw new Error('the mute was not remembered');
        btn.click();
        if (audio.muted || localStorage.getItem('hawkes-net-babylon:muted') !== '0') throw new Error('unmute did not stick');
        if (was) btn.click();                              // leave it as it was found
        return `muted: volume 0, ${audio.stats.silenced - silent} sounds held back, saved for the next visit; unmuted again`;
      });
      await check('A leaving player fades out', async () => {
        if (!guest) throw new Error('no guest joined');
        const id = guest.id, node = mp.peers.get(id)?.node;
        await guest.leave();
        await until(() => mp.leaving.has(id), 10000, 'the guest avatar to start fading');
        await until(() => node.getChildMeshes()[0].visibility < 1, 2000, 'the avatar to turn see-through');
        await until(() => !mp.leaving.has(id) && node.isDisposed(), 4000, 'the faded avatar to be removed');
        return 'faded out, then gone';
      });
    },
  });
  if (window.__hawkesDemoBoot) window.__hawkesDemoBoot.upgradedAt = performance.now();
  engine.runRenderLoop(() => scene.render());
  addEventListener('resize', () => engine.resize());
})().catch((e) => window.__hawkesDemoBoot.fail(e));
</script>
</body>
